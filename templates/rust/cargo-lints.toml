# Merge these sections into Cargo.toml. This file is not consumed by Cargo.

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

# Enable individual pedantic lints when they improve this project. Avoid
# enabling the entire pedantic group without reviewing its noise and MSRV cost.
